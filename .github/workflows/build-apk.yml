name: Build MikroTik Admin APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip and Build APK
        run: |
          unzip -o MikroTikAdmin_AndroidStudio.zip
          cd MikroTikAdmin
          gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MikroTikAdmin-APK
          path: MikroTikAdmin/app/build/outputs/apk/debug/app-debug.apk
